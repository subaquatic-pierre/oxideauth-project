services:
  oxideauth:
    container_name: oxideauth-api
    build:
      context: .
      dockerfile: ./api/Dockerfile.dev
    env_file: ./api/.env.dev
    ports:
      - "8000:8000"
    volumes:
      - ${HOST_PROJECT_DIR:-.}/api:/app/api
      - ${HOST_PROJECT_DIR:-.}/macros:/app/macros
      # Mount cargo registry cache to speed up rebuilds
      - cargo-cache:/usr/local/cargo/registry
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - oxideauth_net

  postgres:
    container_name: oxideauth-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"
    volumes:
      - ./data/psql:/var/lib/postgresql/data/pgdata
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oxideauth_net

  redis:
    container_name: oxideauth-redis
    image: redis:7-alpine
    command: redis-server --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data # Store Redis data persistently
    restart: always
    networks:
      - oxideauth_net

# Define the networks section
networks:
  oxideauth_net:
    driver: bridge

# Named volumes
volumes:
  cargo-cache:
